[package]
name = "sensoryx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Monitor leve de bateria de periféricos, FPS e temperaturas para a barra de tarefas do Windows"

[dependencies]
libloading = "0.8"
sha2 = "0.11.1"
tao = "0.37.2"
wry = "0.57.2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
